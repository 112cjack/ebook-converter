#ebook-converter-demo *{ box-sizing: border-box; }
#ebook-converter-demo .x-sr{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
#ebook-converter-demo .x-frame{
  position: relative;
  background-color: var(--x-paper);
  background-image: var(--x-texture), var(--x-scene);
  background-size: auto, cover;
  background-position: left top, center bottom;
  background-repeat: repeat, no-repeat;
  border: 1px solid var(--x-line);
  border-radius: 14px;
  overflow: hidden;
}
/* ── top bar ── */
#ebook-converter-demo .x-top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding: 12px 20px; background: var(--x-surface);
  border-bottom: 1px solid var(--x-line);
}
#ebook-converter-demo .x-brand{ display:flex; align-items:center; gap:12px; min-width:0; }
#ebook-converter-demo .x-seal{
  width:34px; height:34px; flex:none; border-radius:7px;
  background: var(--x-accentbg); color: var(--x-onaccent);
  font-family: var(--x-serif); font-size:19px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
#ebook-converter-demo .x-title{ font-family: var(--x-serif); font-size:17px; font-weight:700; letter-spacing:.5px; }
#ebook-converter-demo .x-sub{ font-size:12px; color: var(--x-muted); }
#ebook-converter-demo .x-topright{ display:flex; align-items:center; gap:8px; flex:none; }
#ebook-converter-demo .x-cal{
  display:inline-flex; align-items:center; gap:7px;
  font-size:12px; color: var(--x-moss);
  padding:5px 10px; border:1px solid var(--x-line); border-radius:999px;
  background: var(--x-paper); cursor: help;
}
#ebook-converter-demo .x-dot{ width:8px; height:8px; border-radius:50%; background: var(--x-moss); }
#ebook-converter-demo .x-themes{ display:inline-flex; gap:4px; align-items:center; margin-right:6px; }
#ebook-converter-demo .x-theme{
  display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px;
  color:var(--x-muted); background:transparent; border:1px solid transparent; border-radius:999px;
  padding:4px 10px; min-height:28px;
}
#ebook-converter-demo .x-theme:hover{ color:var(--x-ink); border-color:var(--x-line); }
#ebook-converter-demo .x-theme.is-on{
  color:var(--x-ink); border-color:var(--x-line); background:var(--x-surface);
  box-shadow: inset 0 0 0 1px var(--x-accent);
}
#ebook-converter-demo .x-swatch{ width:12px; height:12px; border-radius:50%; border:1px solid var(--x-line); flex:none; }

/* ── 品牌标识：方章 + 双向转换箭头 + 书脊折痕 ── */
#ebook-converter-demo .x-seal{
  display:flex; align-items:center; justify-content:center;
}
#ebook-converter-demo .x-seal svg{ width:22px; height:22px; display:block; }

/* ── 材质颗粒层：SVG 噪点，软光混合，随主题调强度 ── */
#ebook-converter-demo .x-grain{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background-image:var(--x-noise);
  background-size:180px 180px;
  opacity:var(--x-grain);
  mix-blend-mode:soft-light;
}

/* ── Kindle · 悬浮毛玻璃 ── */
#ebook-converter-demo[data-theme="kindle"] .x-frame{
  border-radius:18px; border-color:rgba(27,27,24,.1);
  box-shadow:0 18px 44px rgba(96,106,96,.22);
}
#ebook-converter-demo[data-theme="kindle"] :is(.x-top,.x-row,.x-drop,.x-action,.x-dlg,.x-toast){
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
}
#ebook-converter-demo[data-theme="kindle"] .x-row{ border-color:rgba(27,27,24,.1); }
#ebook-converter-demo[data-theme="kindle"] :is(.x-top,.x-row,.x-drop,.x-action){ box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
#ebook-converter-demo[data-theme="kindle"] .x-primary{ border-radius:10px; }

/* ── 三体 · 双栏控制台（HUD）── */
#ebook-converter-demo[data-theme="santi"] .x-frame{ border-radius:4px; }
#ebook-converter-demo[data-theme="santi"] .x-frame::before,
#ebook-converter-demo[data-theme="santi"] .x-frame::after{
  content:""; position:absolute; width:22px; height:22px; pointer-events:none; z-index:5;
}
#ebook-converter-demo[data-theme="santi"] .x-frame::before{ top:6px; left:6px; border-top:2px solid var(--x-accent); border-left:2px solid var(--x-accent); }
#ebook-converter-demo[data-theme="santi"] .x-frame::after{ bottom:6px; right:6px; border-bottom:2px solid var(--x-accent); border-right:2px solid var(--x-accent); }
#ebook-converter-demo[data-theme="santi"] .x-top{ border-bottom:1px solid var(--x-accent); }
#ebook-converter-demo[data-theme="santi"] .x-title{ font-family:var(--x-mono); letter-spacing:6px; font-size:16px; }
#ebook-converter-demo[data-theme="santi"] .x-sub{ font-family:var(--x-mono); letter-spacing:1px; }
#ebook-converter-demo[data-theme="santi"] .x-main{
  display:grid; grid-template-columns:minmax(210px,280px) 1fr; gap:12px 16px; align-items:start;
}
#ebook-converter-demo[data-theme="santi"] .x-drop{
  grid-column:1; grid-row:1 / span 3; min-height:320px;
  display:flex; flex-direction:column; justify-content:center;
  border-style:solid; border-color:var(--x-accent); border-width:1px;
  box-shadow:inset 0 0 0 1px rgba(214,84,74,.16), inset 0 0 30px rgba(214,84,74,.07);
}
#ebook-converter-demo[data-theme="santi"] .x-listhead,
#ebook-converter-demo[data-theme="santi"] #x-list,
#ebook-converter-demo[data-theme="santi"] .x-empty{ grid-column:2; }
#ebook-converter-demo[data-theme="santi"] .x-listtitle::after{ content:" / QUEUE"; font-family:var(--x-mono); font-size:11px; color:var(--x-muted); }
#ebook-converter-demo[data-theme="santi"] .x-row{
  border-radius:2px;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  background:linear-gradient(180deg, rgba(214,84,74,.06), rgba(214,84,74,0) 40%), var(--x-surface);
}
#ebook-converter-demo[data-theme="santi"] .x-name{ font-family:var(--x-mono); font-weight:700; letter-spacing:.5px; }
#ebook-converter-demo[data-theme="santi"] .x-fmts{ font-family:var(--x-mono); letter-spacing:1px; }
#ebook-converter-demo[data-theme="santi"] .x-dropicon{ color:var(--x-accent); }
#ebook-converter-demo[data-theme="santi"] .x-pfill{ box-shadow:0 0 8px rgba(214,84,74,.55); }
#ebook-converter-demo[data-theme="santi"] .x-ofill{ box-shadow:0 0 8px rgba(214,84,74,.45); }
#ebook-converter-demo[data-theme="santi"] .x-primary{ border-radius:2px; letter-spacing:3px; }
#ebook-converter-demo[data-theme="santi"] .x-go, #ebook-converter-demo[data-theme="santi"] .x-segbtn{ border-radius:2px; }
@media (max-width:840px){
  #ebook-converter-demo[data-theme="santi"] .x-main{ display:block; }
  #ebook-converter-demo[data-theme="santi"] .x-drop{ min-height:0; }
}
/* ── buttons ── */
#ebook-converter-demo .x-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font: inherit; font-size:13px; color: var(--x-ink);
  background: var(--x-surface); border:1px solid var(--x-line); border-radius:8px;
  padding: 7px 12px; min-height:32px;
}
#ebook-converter-demo .x-btn:hover{ border-color: var(--x-muted); }
#ebook-converter-demo .x-linkbtn{
  font: inherit; font-size:13px; color: var(--x-accent);
  background:none; border:none; padding:6px 4px; text-decoration: underline;
  text-underline-offset: 3px;
}
#ebook-converter-demo .x-primary{
  font: inherit; font-size:14px; font-weight:600;
  background: var(--x-accentbg); color: var(--x-onaccent);
  border:none; border-radius:9px; padding: 10px 22px; min-height:42px;
}
#ebook-converter-demo .x-primary:hover{ filter: brightness(1.12); }
#ebook-converter-demo .x-primary:disabled{ opacity:.45; cursor: not-allowed; filter:none; }
#ebook-converter-demo .x-icobtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:7px;
  background:none; border:1px solid transparent; color: var(--x-muted);
}
#ebook-converter-demo .x-icobtn:hover{ color: var(--x-ink); border-color: var(--x-line); background: var(--x-paper); }
/* ── main ── */
#ebook-converter-demo .x-main{ padding:20px; max-width:1020px; margin:0 auto; width:100%; }
#ebook-converter-demo .x-drop{
  border: 1.5px dashed var(--x-line); border-radius: 12px;
  background: var(--x-dropbg);
  padding: 26px 16px 22px; text-align:center;
  transition: border-color .2s ease-out;
}
#ebook-converter-demo .x-drop.is-over{ border-color: var(--x-accent); background: var(--x-drophover); }
#ebook-converter-demo .x-dropicon{ width:30px; height:30px; color: var(--x-muted); }
#ebook-converter-demo .x-droptitle{ font-size:15px; font-weight:600; margin-top:8px; }
#ebook-converter-demo .x-dropsub{ font-size:12px; color: var(--x-muted); margin: 2px 0 8px; }
#ebook-converter-demo .x-droprow{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
#ebook-converter-demo .x-droprow .x-btn{ min-height:38px; padding: 8px 18px; }
#ebook-converter-demo .x-fmts{ margin-top:14px; font-size:12px; color: var(--x-muted); letter-spacing:.3px; }
/* ── list ── */
#ebook-converter-demo .x-listhead{
  display:flex; align-items:center; justify-content:space-between;
  margin: 20px 2px 8px;
}
#ebook-converter-demo .x-listtitle{ font-weight:600; }
#ebook-converter-demo .x-empty{
  border:1px dashed var(--x-line); border-radius:10px;
  background: var(--x-surface);
  padding:18px; text-align:center; color: var(--x-muted); font-size:13px;
}
#ebook-converter-demo .x-row{
  display:grid;
  grid-template-columns: 8px minmax(140px,1.3fr) auto minmax(160px,1.6fr) auto;
  gap: 6px 14px; align-items:center;
  background: var(--x-surface);
  border:1px solid var(--x-line); border-radius:10px;
  padding: 10px 12px 10px 0; margin-bottom:8px;
}
#ebook-converter-demo .x-spine{ width:8px; height:100%; min-height:44px; border-radius:10px 0 0 10px; }
#ebook-converter-demo .x-name{ font-weight:600; overflow-wrap:anywhere; }
#ebook-converter-demo .x-meta{ font-size:12px; color: var(--x-muted); font-family: var(--x-mono); }
#ebook-converter-demo .x-pair{ display:flex; align-items:center; gap:5px; font-size:12px; }
#ebook-converter-demo .x-pair i, #ebook-converter-demo .x-pair svg{ width:13px; height:13px; color: var(--x-muted); }
#ebook-converter-demo .x-chip{
  padding: 2px 8px; border-radius:6px; font-weight:600; letter-spacing:.4px;
  border:1px solid var(--x-line); color: var(--x-muted); background: var(--x-paper);
}
#ebook-converter-demo .x-chip-to{ border-color: var(--x-accent); color: var(--x-accent); background: transparent; }
#ebook-converter-demo .x-status{ display:flex; align-items:center; gap:9px; min-width:0; font-size:13px; }
#ebook-converter-demo .x-badge{
  font-size:12px; color: var(--x-muted);
  border:1px solid var(--x-line); border-radius:999px; padding:2px 10px;
}
#ebook-converter-demo .x-prow{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
#ebook-converter-demo .x-pbar{
  flex:1; height:6px; min-width:70px; border-radius:999px;
  background: var(--x-track);
}
#ebook-converter-demo .x-pfill{
  height:100%; border-radius:999px; background: var(--x-accentbg);
  transition: width .15s linear;
}
#ebook-converter-demo .x-ptext{ font-size:12px; color: var(--x-muted); font-family: var(--x-mono); width:38px; text-align:right; }
#ebook-converter-demo .x-stamp{
  width:22px; height:22px; flex:none; border-radius:6px;
  background: var(--x-accentbg); color: var(--x-onaccent);
  display:inline-flex; align-items:center; justify-content:center;
}
#ebook-converter-demo .x-stamp svg{ width:14px; height:14px; }
#ebook-converter-demo .x-done{ color: var(--x-moss); font-weight:600; white-space:nowrap; }
#ebook-converter-demo .x-out{ font-size:12px; color: var(--x-muted); font-family: var(--x-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#ebook-converter-demo .x-failwrap{ display:flex; flex-direction:column; gap:1px; min-width:0; }
#ebook-converter-demo .x-fail{ color: var(--x-clay); font-weight:600; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
#ebook-converter-demo .x-fail svg{ width:14px; height:14px; }
#ebook-converter-demo .x-reason{ font-size:12px; color: var(--x-muted); }
#ebook-converter-demo .x-acts{ display:flex; align-items:center; gap:2px; }
#ebook-converter-demo .x-mini{
  display:inline-flex; align-items:center; gap:5px;
  font: inherit; font-size:12px; color: var(--x-muted);
  background:none; border:1px solid transparent; border-radius:7px;
  padding:6px 8px; min-height:30px; white-space:nowrap;

<script>
(function(){
  var root = document.getElementById("ebook-converter-demo");
  if(!root) return;
  var $ = function(id){ return root.querySelector("#" + id); };

  var FMTS = { epub:"EPUB", mobi:"MOBI", azw3:"AZW3", pdf:"PDF", txt:"TXT", docx:"DOCX" };
  var OUTS = ["EPUB","PDF","TXT","MOBI"];
  var SPINE = {
    EPUB:"light-dark(#2E6E5E,#4E9382)", MOBI:"light-dark(#B0803A,#C99A55)",
    PDF:"light-dark(#4A5560,#7C8794)", TXT:"light-dark(#8A8578,#A8A294)",
    AZW3:"light-dark(#3E5C76,#6E8DA8)", DOCX:"light-dark(#7A5E8C,#A38BB4)"
  };
  var SAMPLES = [
    { name:"三体.epub", size:1258291 },
    { name:"人类简史.mobi", size:2457600 },
    { name:"毕业论文.pdf", size:3250585 },
    { name:"读书笔记.txt", size:28672 },
    { name:"受DRM保护的小说.azw3", size:943718 }
  ];
  var MOCK_HISTORY = [
    { time:"昨天 19:42", name:"三体.epub", pair:"EPUB → PDF", st:"ok",  note:"完成" },
    { time:"昨天 20:15", name:"人类简史.mobi", pair:"MOBI → EPUB", st:"ok", note:"完成" },
    { time:"前天 21:10", name:"扫描版讲义.pdf", pair:"PDF → TXT", st:"bad", note:"图片型 PDF，无文字层" }
  ];

  var state = { tasks:[], to:null, running:false, seq:0 };

  function esc(s){ return s; } // DOM built with textContent only
  function sizeFmt(n){
    if(n >= 1048576) return (n/1048576).toFixed(1) + " MB";
    if(n >= 1024) return Math.round(n/1024) + " KB";
    return n + " B";
  }
  function fmtOf(name){
    var m = /\.([a-z0-9]+)$/i.exec(name);
    return m ? FMTS[m[1].toLowerCase()] : null;
  }
  function icons(){ if(window.lucide) lucide.createIcons({ attrs:{ width:16, height:16 } }); }
  function announce(msg){ var el = $("x-live"); if(el) el.textContent = msg; }

  function toast(msg, kind){
    var box = $("x-toasts"); if(!box) return;
    var d = document.createElement("div");
    d.className = "x-toast" + (kind === "warn" ? " is-warn" : kind === "ok" ? " is-ok" : "");
    d.setAttribute("role", "status");
    d.textContent = msg;
    box.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 4200);
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function icon(name){
    var i = document.createElement("i");
    i.setAttribute("data-lucide", name);
    i.setAttribute("aria-hidden", "true");
    return i;
  }

  function addFiles(list){
    var added = 0, skipped = [], dup = 0;
    Array.prototype.forEach.call(list, function(f){
      var fmt = fmtOf(f.name);
      if(!fmt){ skipped.push(f.name); return; }
      var exists = state.tasks.some(function(t){ return t.name === f.name && t.size === f.size; });
      if(exists){ dup++; return; }
      state.tasks.push({ id: ++state.seq, name: f.name, size: f.size || 0, from: fmt, to: null,
        status: "wait", progress: 0, outName: null, reason: null });
      added++;
    });
    if(added){ announce("已添加 " + added + " 个文件"); toast("已添加 " + added + " 个文件", "ok"); }
    if(dup){ toast("有 " + dup + " 个文件已在列表中，未重复添加", "warn"); }
    if(skipped.length){ toast("已跳过不支持的格式：" + skipped.join("、"), "warn"); }
    render();
  }

  function removeTask(id){
    var t = state.tasks.find(function(x){ return x.id === id; });
    if(!t || t.status === "run") return;
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    render();
  }

  function clearList(){
    if(state.running) return;
    state.tasks = [];
    render();
    announce("列表已清空");
  }

  function rowActs(t){
    var acts = el("div", "x-acts");
    if(t.status === "done"){
      var open = el("button", "x-mini cursor-interaction");
      open.type = "button";
      open.appendChild(icon("folder-open"));
      open.appendChild(document.createTextNode("打开文件夹"));
      open.addEventListener("click", function(){
        toast("演示环境：真实版本将打开输出文件夹 " + $("x-outdir").value, "info");
      });
      acts.appendChild(open);
    }
    if(t.status === "fail"){
      var retry = el("button", "x-mini cursor-interaction");
      retry.type = "button";
      retry.appendChild(icon("rotate-ccw"));
      retry.appendChild(document.createTextNode("重试"));
      retry.addEventListener("click", function(){
        t.status = "wait"; t.progress = 0; t.reason = null;
        render();
        toast("已重新加入队列，点击「开始转换」重试", "info");
      });
      acts.appendChild(retry);
    }
    if(t.status !== "run"){
      var rm = el("button", "x-icobtn cursor-interaction");
      rm.type = "button";
      rm.setAttribute("aria-label", "移除 " + t.name);
      rm.appendChild(icon("x"));
      rm.addEventListener("click", function(){ removeTask(t.id); });
      acts.appendChild(rm);
    }
    return acts;
  }

  function rowStatus(t){
    var st = el("div", "x-status");
    if(t.status === "wait"){
      st.appendChild(el("span", "x-badge", "等待"));
    } else if(t.status === "run"){
      var prow = el("div", "x-prow");
      var bar = el("div", "x-pbar");
      var fill = el("div", "x-pfill");
      fill.style.width = Math.round(t.progress) + "%";
      bar.appendChild(fill);
      prow.appendChild(bar);
      var pt = el("span", "x-ptext", Math.round(t.progress) + "%");
      prow.appendChild(pt);
      st.appendChild(prow);
    } else if(t.status === "done"){
      var stamp = el("span", "x-stamp");
      stamp.appendChild(icon("check"));
      st.appendChild(stamp);
      var wrap = el("div", "");
      wrap.style.cssText = "min-width:0";
      var d1 = el("div", "x-done", "已完成");
      var d2 = el("div", "x-out", t.outName || "");
      wrap.appendChild(d1); wrap.appendChild(d2);
      st.appendChild(wrap);
    } else {
      var fw = el("div", "x-failwrap");
      var f1 = el("span", "x-fail");
      f1.appendChild(icon("alert-circle"));
      f1.appendChild(document.createTextNode("转换失败"));
      var f2 = el("span", "x-reason", t.reason || "");
      fw.appendChild(f1); fw.appendChild(f2);
      st.appendChild(fw);
    }
    return st;
  }

  function render(){
    var list = $("x-list");
    list.textContent = "";
    state.tasks.forEach(function(t){
      var row = el("div", "x-row");
      row.setAttribute("data-id", t.id);
      var spine = el("span", "x-spine");
      spine.style.background = SPINE[t.from] || SPINE.TXT;
      spine.setAttribute("aria-hidden", "true");
      row.appendChild(spine);

      var f = el("div", "x-file");
      f.appendChild(el("div", "x-name", t.name));
      f.appendChild(el("div", "x-meta", sizeFmt(t.size) + " · " + t.from));
      row.appendChild(f);

      var pair = el("div", "x-pair");
      pair.appendChild(el("span", "x-chip", t.from));
      pair.appendChild(icon("arrow-right"));
      var toChip = t.to || state.to;
      pair.appendChild(el("span", "x-chip" + (toChip ? " x-chip-to" : ""), toChip || "…"));
      row.appendChild(pair);

      row.appendChild(rowStatus(t));
      row.appendChild(rowActs(t));
      list.appendChild(row);
    });

    var n = state.tasks.length;
    $("x-count").textContent = n ? "（" + n + "）" : "";
    $("x-empty").style.display = n ? "none" : "";
    $("x-clear").disabled = state.running || !n;
    $("x-clear").style.opacity = ($("x-clear").disabled) ? ".45" : "";
    updateAction();
    updateOverall();
    icons();
  }

  function updateAction(){
    var wait = state.tasks.filter(function(t){ return t.status === "wait"; }).length;
    var go = $("x-go");
    go.disabled = state.running || !state.to || !wait;
    go.textContent = state.running ? "转换中…" : "开始转换";
    Array.prototype.forEach.call(root.querySelectorAll(".x-segbtn"), function(b){
      b.disabled = state.running;
    });
    var helper = $("x-helper");
    if(!state.to) helper.textContent = "请先选择输出格式";
    else if(wait) helper.textContent = "输出为 " + state.to + " · 待转换 " + wait + " 个文件";
    else helper.textContent = "输出为 " + state.to + " · 没有待转换文件";
  }

  function updateOverall(){
    var total = state.tasks.length;
    var fin = state.tasks.filter(function(t){ return t.status === "done" || t.status === "fail"; }).length;
    $("x-ofill").style.width = total ? Math.round(fin / total * 100) + "%" : "0%";
    $("x-otext").textContent = fin + "/" + total;
  }

  function updateTaskDom(t){
    var row = root.querySelector('[data-id="' + t.id + '"]');
    if(!row) return;
    var fill = row.querySelector(".x-pfill");
    var pt = row.querySelector(".x-ptext");
    if(fill) fill.style.width = Math.round(t.progress) + "%";
    if(pt) pt.textContent = Math.round(t.progress) + "%";
  }

  function animateTask(t, onEnd){
    var isDrm = /DRM/i.test(t.name);
    var p = t.progress || 0;
    var iv = setInterval(function(){
      p += 2 + Math.random() * 3.2;
      if(isDrm && p >= 38){
        clearInterval(iv);
        t.status = "fail";
        t.reason = "该书受 DRM 版权保护，无法转换（合规限制）";
        render();
        announce(t.name + " 转换失败：" + t.reason);
        onEnd();
        return;
      }
      if(p >= 100){
        clearInterval(iv);
        t.status = "done";
        t.outName = t.name.replace(/\.[^.]+$/, "") + "." + (t.to || state.to || "epub").toLowerCase();
        render();
        announce(t.name + " 转换完成");
        onEnd();
        return;
      }
      t.progress = p;
      updateTaskDom(t);
    }, 90);
  }

  function convert(){
    if(state.running) return;
    if(!state.to){ toast("请先选择输出格式", "warn"); return; }
    var queue = state.tasks.filter(function(t){ return t.status === "wait"; });
    if(!queue.length){ toast("没有待转换的文件", "warn"); return; }
    state.running = true;
    render();
    announce("开始转换，共 " + queue.length + " 个文件");
    var i = 0;
    function next(){
      if(i >= queue.length){
        state.running = false;
        render();
        var done = state.tasks.filter(function(t){ return t.status === "done"; }).length;
        var fail = state.tasks.filter(function(t){ return t.status === "fail"; }).length;
        var msg = fail && done ? "转换完成：成功 " + done + " 个，失败 " + fail + " 个"
               : fail ? "转换结束：" + fail + " 个文件失败"
               : "全部转换完成，共 " + done + " 个文件";
        toast(msg, fail ? "warn" : "ok");
        announce(msg);
        return;
      }
      var t = queue[i++];
      if(t.status !== "wait"){ next(); return; }
      t.to = state.to;
      t.status = "run";
      render();
      setTimeout(function(){ animateTask(t, next); }, 150);
    }
    next();
  }

  // ── wire up ──
  $("x-file").addEventListener("change", function(e){
    addFiles(e.target.files);
    e.target.value = "";
  });
  var drop = $("x-drop");
  ["dragenter", "dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("is-over"); });
  });
  drop.addEventListener("dragleave", function(e){
    if(!drop.contains(e.relatedTarget)) drop.classList.remove("is-over");
  });
  drop.addEventListener("drop", function(e){
    e.preventDefault();
    drop.classList.remove("is-over");
    if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  $("x-sample").addEventListener("click", function(){ addFiles(SAMPLES); });

  Array.prototype.forEach.call(root.querySelectorAll(".x-segbtn"), function(b){
    b.addEventListener("click", function(){
      state.to = b.getAttribute("data-to");
      Array.prototype.forEach.call(root.querySelectorAll(".x-segbtn"), function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      state.tasks.forEach(function(t){ if(t.status === "wait") t.to = state.to; });
      updateAction();
      render();
    });
  });

  $("x-go").addEventListener("click", convert);
  $("x-clear").addEventListener("click", clearList);

  // settings dialog
  var setDlg = $("x-setdlg");
  $("x-setbtn").addEventListener("click", function(){ setDlg.showModal(); });
  $("x-setclose").addEventListener("click", function(){ setDlg.close(); });
  $("x-setcancel").addEventListener("click", function(){ setDlg.close(); });
  $("x-setsave").addEventListener("click", function(){
    setDlg.close();
    toast("设置已保存（演示数据，不持久化）", "ok");
  });

  // history dialog
  var histDlg = $("x-histdlg");
  function openHistory(){
    var body = $("x-histbody");
    body.textContent = "";
    var rows = MOCK_HISTORY.slice();
    var now = new Date();
    var hh = function(x){ return (x < 10 ? "0" : "") + x; };
    state.tasks.filter(function(t){ return t.status === "done"; }).forEach(function(t){
      rows.unshift({ time: "今天 " + hh(now.getHours()) + ":" + hh(now.getMinutes()),
        name: t.name, pair: t.from + " → " + (t.to || state.to || ""), st: "ok", note: "完成" });
    });
    rows.forEach(function(r){
      var row = el("div", "x-hrow");
      row.appendChild(el("span", "x-htime", r.time));
      row.appendChild(el("span", "x-hname", r.name));
      var p = el("span", "x-meta", r.pair);
      row.appendChild(p);
      var s = el("span", r.st === "ok" ? "x-hst-ok" : "x-hst-bad", r.note);
      row.appendChild(s);
      body.appendChild(row);
    });
    histDlg.showModal();
  }
  $("x-histbtn").addEventListener("click", openHistory);
  $("x-histclose").addEventListener("click", function(){ histDlg.close(); });
  $("x-histok").addEventListener("click", function(){ histDlg.close(); });

  // ── 颜色风格切换（夜读 / Kindle / 三体）──
  var THEME_KEY = "ebookDemoTheme";
  function applyTheme(name){
    if(["night","kindle","santi"].indexOf(name) < 0) name = "night";
    root.setAttribute("data-theme", name);
    // Chromium 在 color-scheme 切换后 backdrop-filter 层可能渲染陈旧，强制重绘一次
    var frame = root.querySelector(".x-frame");
    if(frame){
      frame.style.opacity = "0.99";
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ frame.style.opacity = ""; }); });
    }
    Array.prototype.forEach.call(root.querySelectorAll(".x-theme"), function(b){
      b.classList.toggle("is-on", b.getAttribute("data-theme") === name);
    });
    try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
  }
  Array.prototype.forEach.call(root.querySelectorAll(".x-theme"), function(b){
    b.addEventListener("click", function(){
      applyTheme(b.getAttribute("data-theme"));
      toast("已切换风格：" + b.textContent.trim(), "info");
    });
  });
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(savedTheme || "night");

  render();
  icons();
})();
</script>
</div>

</div>
</body>
</html>
